<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Login Form</title>

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Balls -->
    <span class="ball ball-1"></span>
    <span class="ball ball-2"></span>
    <span class="ball ball-3"></span>
    <span class="ball ball-4"></span>
    <span class="ball ball-5"></span>
    <span class="ball ball-6"></span>
    <span class="ball ball-7"></span>

    <!-- Glass Circle -->
    <div class="glass-circle">

        <form class="login-form">

            <h1>Login</h1>

            <div class="input-box">
                <i class="ri-mail-line"></i>
                <input type="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <i class="ri-lock-line"></i>
                <input type="password" placeholder="Password" required>
            </div>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>
</html>
